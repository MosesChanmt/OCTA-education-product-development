<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Product Roadmap</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        /* Custom styles for the bilingual feature */
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #818cf8;
            --bg-light: #f9fafb;
            --text-dark: #1f2937;
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s;
        }

        /* Styling for the stepper items */
        .step-item {
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            z-index: 10;
        }

        .step-item.active .step-number {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.4), 0 2px 4px -2px rgba(79, 70, 229, 0.4);
            transform: scale(1.1);
        }

        .step-item:not(.active):hover .step-number {
            background-color: var(--secondary-color);
            color: white;
        }

        .step-item.active .step-title {
            color: var(--primary-color);
            font-weight: 600;
        }

        .step-number {
            width: 2.5rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            border-radius: 9999px;
            background-color: #e5e7eb;
            color: var(--text-dark);
            transition: all 0.2s ease;
        }

        /* Stepper separator lines */
        .stepper-line {
            position: absolute;
            left: 1.2rem;
            top: 2.5rem;
            bottom: 0;
            width: 2px;
            background-color: #e5e7eb;
            z-index: 1;
        }
        .step-item:last-child .stepper-line {
            display: none;
        }

        /* Content card animation */
        .card-content {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Language specific styling */
        .lang-en [data-lang="zh"],
        .lang-zh [data-lang="en"] {
            display: none;
        }
    </style>
</head>

                    example: '宣布原始 <b>v1 型號</b>將在 $3$ 年後停止<b>韌體更新</b>和<b>雲端支援</b>（提供 $36$ 個月的通知）。為升級到<b>v3 型號</b>（下一代繼任者）的使用者提供實質性的以舊換新折扣，以鼓勵過渡並維持客戶忠誠度。'

        let currentStageId = 1;
        const body = document.body;
        const stepsContainer = document.getElementById('steps-container');
        const contentCard = document.getElementById('content-card');
        const stageTitleEl = document.getElementById('stage-title');
        const stageBilingualTitleEl = document.getElementById('stage-bilingual-title');
        const stageDescriptionEl = document.getElementById('stage-description');
        const stageActivitiesEl = document.getElementById('stage-activities');
        const stageExampleEl = document.getElementById('stage-example');
        const stageIconEl = document.getElementById('stage-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const langToggleBtn = document.getElementById('lang-toggle');

        // Function to render the steps in the sidebar
        function renderSteps() {
            stepsContainer.innerHTML = '';
            const lang = body.classList.contains('lang-zh') ? 'zh' : 'en';

            roadmapData.forEach((stage, index) => {
                const isActive = stage.id === currentStageId;
                const title = stage[lang].title;
                
                const stepElement = document.createElement('div');
                stepElement.className = `step-item flex items-start space-x-4 p-2 rounded-lg ${isActive ? 'active bg-indigo-50' : 'hover:bg-gray-100'} transition duration-200`;
                stepElement.setAttribute('data-id', stage.id);
                stepElement.innerHTML = `
                    <div class="relative flex-shrink-0">
                        <div class="step-number text-sm">${stage.id}</div>
                        ${index < roadmapData.length - 1 ? '<div class="stepper-line"></div>' : ''}
                    </div>
                    <div class="flex flex-col pt-1 pl-1">
                        <p class="text-xs text-gray-400">
                            <span data-lang="en">Phase ${stage.id}</span>
                            <span data-lang="zh">階段 ${stage.id}</span>
                        </p>
                        <p class="step-title text-base font-medium text-gray-700">${title}</p>
                    </div>
                `;
                
                stepElement.addEventListener('click', () => {
                    currentStageId = stage.id;
                    updateUI();
                });
                stepsContainer.appendChild(stepElement);
            });
        }

        // Function to render the main content card
        function renderContent() {
            const stage = roadmapData.find(s => s.id === currentStageId);
            if (!stage) return;

            // Determine language
            const langKey = body.classList.contains('lang-zh') ? 'zh' : 'en';
            const content = stage[langKey];

            // Update main elements
            stageIconEl.textContent = stage.icon;
            stageTitleEl.textContent = content.title;
            stageBilingualTitleEl.textContent = content.bilingualTitle;

            // IMPORTANT: Switched to innerHTML to allow for <b> tags for bolding
            stageDescriptionEl.innerHTML = content.description;
            stageExampleEl.innerHTML = content.example;

            // Update activities list
            stageActivitiesEl.innerHTML = '';
            content.activities.forEach(activity => {
                const li = document.createElement('li');
                li.textContent = activity;
                stageActivitiesEl.appendChild(li);
            });

            // Update button states
            prevBtn.disabled = currentStageId === 1;
            nextBtn.disabled = currentStageId === roadmapData.length;

            // Scroll to top of content
            contentCard.parentElement.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Global UI update function
        function updateUI() {
            // Re-render content first (as it controls the fade-in animation)
            renderContent();
            
            // Re-render navigation (to update active state)
            renderSteps();
        }

        // --- Event Listeners ---
        
        // Navigation buttons
        prevBtn.addEventListener('click', () => {
            if (currentStageId > 1) {
                currentStageId--;
                updateUI();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentStageId < roadmapData.length) {
                currentStageId++;
                updateUI();
            }
        });

        // Language toggle
        langToggleBtn.addEventListener('click', () => {
            const isZh = body.classList.toggle('lang-zh');
            if (!isZh) {
                body.classList.remove('lang-zh');
                body.classList.add('lang-en');
            } else {
                body.classList.remove('lang-en');
                body.classList.add('lang-zh');
            }
            updateUI(); // Re-render all elements with the new language
        });

        // Initial load
        window.onload = function() {
            updateUI();
        };
    </script>
